name: probe
on: workflow_dispatch
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - name: direct fetch
        run: |
          code=$(curl -sS -o /tmp/a.html -w "%{http_code}" --max-time 40 \
            "https://asbdavani.app/performance/horses/clpniifd30xrvwrdou43sfs9b/info" || echo "ERR")
          echo "DIRECT_HTTP=$code"
          echo "DIRECT_BYTES=$(wc -c < /tmp/a.html 2>/dev/null || echo 0)"
          echo "DIRECT_RACES=$(grep -c 'هفته' /tmp/a.html 2>/dev/null || echo 0)"
      - name: jina fetch
        run: |
          code=$(curl -sS -o /tmp/b.txt -w "%{http_code}" --max-time 90 \
            "https://r.jina.ai/https://asbdavani.app/performance/horses/clpniifd30xrvwrdou43sfs9b/info" || echo "ERR")
          echo "JINA_HTTP=$code"
          echo "JINA_BYTES=$(wc -c < /tmp/b.txt 2>/dev/null || echo 0)"
          echo "JINA_RACES=$(grep -c 'هفته' /tmp/b.txt 2>/dev/null || echo 0)"
          echo "JINA_MORPHINE=$(grep -c MORPHINE /tmp/b.txt 2>/dev/null || echo 0)"
